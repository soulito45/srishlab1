{% extends "base.html" %}
{% block title %}Login - IDAA{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <span class="brand-icon d-inline-flex mb-2" style="width:52px;height:52px;font-size:1.5rem;"><i class="bi bi-cpu-fill"></i></span>
      <h3 class="mt-2 mb-1">Welcome back</h3>
      <p class="text-muted small">Sign in to continue to your dashboard</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label">Username or Email</label>
        <input type="text" name="identifier" class="form-control" placeholder="e.g. priya_sharma" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-idaa w-100 mt-2"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
    </form>
    <p class="text-center text-muted small mt-4 mb-0">
      Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent-2);">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
