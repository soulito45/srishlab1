{% extends "base.html" %}
{% block title %}Create Account - IDAA{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <span class="brand-icon d-inline-flex mb-2" style="width:52px;height:52px;font-size:1.5rem;"><i class="bi bi-cpu-fill"></i></span>
      <h3 class="mt-2 mb-1">Create your account</h3>
      <p class="text-muted small">Start analyzing your data in minutes</p>
    </div>
    <form method="POST" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="e.g. Priya Sharma">
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Username *</label>
          <input type="text" name="username" class="form-control" placeholder="priya_sharma" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Email *</label>
          <input type="email" name="email" class="form-control" placeholder="priya@example.com" required>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-idaa w-100 mt-2"><i class="bi bi-person-plus me-2"></i>Create Account</button>
    </form>
    <p class="text-center text-muted small mt-4 mb-0">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-2);">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
